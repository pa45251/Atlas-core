[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core"
version = "0.1.0"
description = "Local-first personal knowledge intelligence engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlas = "atlas_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
